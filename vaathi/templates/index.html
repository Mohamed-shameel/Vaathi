<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Chat Interface -->
            <div class="col-12 d-flex flex-column">
                <!-- Header -->
                <div class="chat-header bg-primary text-white p-3">
                    <h4 class="mb-0">🤖 AI Study Buddy</h4>
                    <small>Your personal learning assistant</small>
                </div>
                
                <!-- Chat Messages -->
                <div class="flex-grow-1 p-3 overflow-auto" id="chatMessages">
                    <div class="message ai-message">
                        <div class="message-content">
                            <strong>AI Study Buddy:</strong>
                            <p>Hi! I'm your AI Study Buddy. I'm here to help you with your studies. Ask me anything about your coursework, concepts you're learning, or any academic questions you have!</p>
                        </div>
                        <small class="text-muted">Just now</small>
                    </div>
                </div>
                
                <!-- Input Area -->
                <div class="chat-input bg-light p-3">
                    <div class="input-group">
                        <input type="text" id="messageInput" class="form-control" 
                               placeholder="Ask me anything about your studies..." 
                               aria-label="Message input">
                        <button class="btn btn-primary" type="button" id="sendButton">
                            Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
